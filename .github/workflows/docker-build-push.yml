name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblio-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblio-api:${{ github.sha }}
   # ─────────────────────────────────────────
  # JOB 2 : Déploiement sur le serveur
  # ─────────────────────────────────────────
  deploy:
    name:  Deploy
    runs-on: ubuntu-latest
    needs: build-and-push   # attend que le build réussisse
 
    steps:
      # ── 1. Connexion SSH + pull + run ──────────────────────────────
      - name: SSH → Pull & Run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e   # arrêt immédiat en cas d'erreur
 
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/biblio-api:${{ github.sha }}"
            CONTAINER="biblio-api"
            HOST_PORT=3000
            APP_PORT=3000
 
            echo "──────────────────────────────────"
            echo " Login DockerHub…"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
 
            echo " Pull image : $IMAGE"
            docker pull "$IMAGE"
 
            echo " Arrêt / suppression de l'ancien conteneur (si existant)…"
            docker stop  "$CONTAINER" 2>/dev/null || true
            docker rm    "$CONTAINER" 2>/dev/null || true
 
            echo "  Lancement du nouveau conteneur…"
            docker run -d \
              --name          "$CONTAINER" \
              --restart       unless-stopped \
              -p              "$HOST_PORT:$APP_PORT" \
              --health-cmd    "curl -sf http://localhost:$APP_PORT/health || exit 1" \
              --health-interval  15s \
              --health-timeout   5s  \
              --health-retries   3   \
              "$IMAGE"
 
            echo " Conteneur démarré."
 
      # ── 2. Health check (depuis le runner GitHub) ──────────────────
      - name: Health check
        id: health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            CONTAINER="biblio-api"
            MAX_RETRIES=10
            WAIT_SECONDS=6
 
            echo " Attente que le health-check Docker soit healthy…"
            for i in $(seq 1 $MAX_RETRIES); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              echo "  Tentative $i/$MAX_RETRIES — status : $STATUS"
 
              if [ "$STATUS" = "healthy" ]; then
                echo " Conteneur healthy !"
                exit 0
              fi
 
              if [ "$STATUS" = "unhealthy" ]; then
                echo " Conteneur unhealthy."
                docker logs --tail 50 "$CONTAINER"
                exit 1
              fi
 
              sleep $WAIT_SECONDS
            done
 
            echo " Timeout : le conteneur n'est pas healthy après $(($MAX_RETRIES * $WAIT_SECONDS))s."
            docker logs --tail 50 "$CONTAINER"
            exit 1
 
  # ─────────────────────────────────────────
  # JOB 3 : Notifications
  # ─────────────────────────────────────────
  notify:
    name:  Notify
    runs-on: ubuntu-latest
    needs: deploy
    # toujours exécuté, même si deploy échoue
    if: always()
 
    steps:
      # ── Notification email ─────────────────────────────
      - name: Email — échec
        if: needs.deploy.result != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    465
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[biblio-api] Déploiement échoué — ${{ github.sha }}"
          to:             ${{ secrets.MAIL_RECIPIENT }}
          from:           GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Le déploiement de biblio-api a échoué.
 
            Branche  : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Auteur   : ${{ github.actor }}
            Logs     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}